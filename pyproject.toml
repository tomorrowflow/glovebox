[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glovebox"
version = "0.1.0"
description = "A gated data layer for self-hosted AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[project.scripts]
glovebox = "glovebox.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]
