[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glovebox"
version = "0.1.0"
description = "A gated data layer for self-hosted AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio==4.16.0",
    "imapclient==4.3.0",
    "mcp==2.3.0",
    "pydantic==2.14.3",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.2",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[project.scripts]
glovebox = "glovebox.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# IMAPClient ships neither stubs nor a py.typed marker.
module = ["imapclient", "imapclient.*"]
ignore_missing_imports = true
