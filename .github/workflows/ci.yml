name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install
        run: python3 -m venv .venv && .venv/bin/pip install -c constraints.txt -e ".[dev]"
      - name: Lint
        run: .venv/bin/python -m ruff check . && .venv/bin/python -m ruff format --check .
      - name: Type check
        run: .venv/bin/python -m mypy
      - name: Test
        run: .venv/bin/python -m pytest
